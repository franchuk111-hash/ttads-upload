<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,follow">
<title>Перехід…</title>
<style>body{margin:0;height:100vh;display:grid;place-items:center;background:#07080d;color:#9aa3b2;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}a{color:#ff2d6f}</style>
<script>
/* ==== ПАРТНЁРСКАЯ ССЫЛКА ==== */
var AFF_BASE = "https://ad.admitad.com/g/077hu89zbv8f39f183bb76e4f989a7/";
var AFF_SUB  = "subid";                        // параметр, который уходит в sid3
var AFF_TAG  = "ferew763646346dffdfddddd3";    // постоянный тег (фолбэк без gclid)
/* =========================== */
(function(){
  var qs = new URLSearchParams(location.search);
  var gclid = qs.get("gclid") || "";
  var alt = [qs.get("utm_source")||"", qs.get("utm_medium")||"", qs.get("utm_campaign")||""].join("_").replace(/^_+|_+$/g,"");
  var sub = (qs.get("sub1") || gclid || alt || AFF_TAG).slice(0,64);

  var url = AFF_BASE + (AFF_BASE.indexOf("?") > -1 ? "&" : "?") + AFF_SUB + "=" + encodeURIComponent(sub);
  ["utm_source","utm_medium","utm_campaign","utm_content","utm_term"].forEach(function(k){
    var v = qs.get(k); if (v) url += "&" + k + "=" + encodeURIComponent(v);
  });
  location.replace(url);
  setTimeout(function(){ location.href = url; }, 300);
})();
</script>
</head>
<body><p>Переходимо… Якщо нічого не сталося — <a href="https://ad.admitad.com/g/077hu89zbv8f39f183bb76e4f989a7/">натисніть тут</a>.</p></body>
</html>
