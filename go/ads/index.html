<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,follow">
<title>Перехід…</title>
<script>
/* ==== ЕДИНСТВЕННОЕ МЕСТО, КУДА СТАВИТСЯ ПАРТНЁРСКАЯ ССЫЛКА ==== */
var AFF_URL = "https://tiktok-ads.com.ua/";   // ← партнёрская ссылка
var AFF_SUB = "sub1";                         // ← имя параметра subid у партнёрки
/* ============================================================== */
(function(){
  var qs = new URLSearchParams(location.search);
  var gclid = qs.get("gclid") || "";
  var sub = gclid || ([qs.get("utm_source")||"",qs.get("utm_medium")||"",qs.get("utm_campaign")||""].join("_").replace(/^_+|_+$/g,"") || "direct");
  var sub1 = qs.get(AFF_SUB) || qs.get("sub1") || sub;
  var url = AFF_URL + (AFF_URL.indexOf("?") > -1 ? "&" : "?") + AFF_SUB + "=" + encodeURIComponent(sub1);
  ["utm_source","utm_medium","utm_campaign","utm_content","utm_term","gclid"].forEach(function(k){
    var v = qs.get(k); if (v && k !== "gclid") url += "&" + k + "=" + encodeURIComponent(v);
  });
  if (gclid) url += "&gclid=" + encodeURIComponent(gclid);
  location.replace(url);
})();
</script>
<style>body{margin:0;height:100vh;display:grid;place-items:center;background:#07080d;color:#9aa3b2;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}a{color:#ff2d6f}</style>
</head>
<body><p>Переходимо… Якщо нічого не сталося — <a href="https://tiktok-ads.com.ua/">натисніть тут</a>.</p>
<noscript><meta http-equiv="refresh" content="0;url=https://tiktok-ads.com.ua/"></noscript></body>
</html>
